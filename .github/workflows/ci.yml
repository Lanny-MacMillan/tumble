name: CI

# changes to docs, screenshots or the license touch neither the game nor its tests, so they skip the run
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'screenshots/**', 'LICENSE', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', 'screenshots/**', 'LICENSE', '.gitignore']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (slice ${{ matrix.slice }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # the long fairness checks are split four ways; the four jobs together cover every case
      - run: npm test
        env:
          TEST_SLICE: ${{ matrix.slice }}/4

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # only the game itself goes on the site
      - run: mkdir _site && cp -r index.html src _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
